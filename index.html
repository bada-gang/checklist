<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎒 오늘 할 일 체크하기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap');

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  html {
    font-size: 17.6px; /* 기본 16px 대비 10% 확대 */
  }

  :root {
    --pink: #ff8fab;
    --peach: #ffd6a5;
    --yellow: #fff3b0;
    --mint: #b7f0d1;
    --sky: #a9def9;
    --lavender: #d5b8ff;
    --ink: #5c4b51;
    --card: #ffffffcc;
  }

  body {
    margin: 0;
    font-family: 'Gaegu', 'Comic Sans MS', system-ui, sans-serif;
    font-weight: bold;
    color: var(--ink);
    background: linear-gradient(135deg, #ffe3ec 0%, #fff6e0 25%, #e3fbe9 50%, #e0f4ff 75%, #f1e6ff 100%);
    background-size: 400% 400%;
    animation: bgShift 20s ease infinite;
    padding: 12px 20px 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  h1 {
    font-family: 'Jua', 'Gaegu', sans-serif;
    text-align: center;
    font-size: 1.7rem;
    margin: 2px 0 0;
    color: #ff5d8f;
    text-shadow: 2px 2px 0 #fff, 3px 3px 0 rgba(0,0,0,0.05);
  }
  .subtitle {
    text-align: center;
    margin: 0 0 8px;
    font-size: 0.85rem;
    opacity: 0.75;
  }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 10px 16px;
    margin-bottom: 10px;
    box-shadow: 0 6px 0 rgba(255, 180, 200, 0.4), 0 10px 24px rgba(0,0,0,0.06);
    border: 3px solid #fff;
    flex-shrink: 0;
  }

  .grid-card {
    flex: 1;
    min-height: 0;
    display: flex;
    margin-bottom: 4px;
  }

  button {
    font-family: 'Gaegu', sans-serif;
    font-size: 1rem;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    background: var(--pink);
    color: #fff;
    box-shadow: 0 4px 0 #e05c85;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    font-weight: bold;
  }
  button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #e05c85;
  }
  /* task manager */
  .task-add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .task-add-row input[type=text] {
    width: 160px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 2px solid #ffd0e0;
    font-family: 'Gaegu', sans-serif;
    font-size: 0.95rem;
    outline: none;
  }
  .task-add-row input[type=text]:focus {
    border-color: var(--pink);
  }
  .task-add-row .sep {
    width: 1px;
    background: #ffd0e0;
    margin: 2px 4px;
  }
  .task-add-row label {
    font-size: 0.95rem;
    white-space: nowrap;
  }
  .task-add-row input[type=number] {
    width: 52px;
    padding: 6px 8px;
    border-radius: 999px;
    border: 2px solid #ffd0e0;
    font-family: 'Gaegu', sans-serif;
    font-size: 0.95rem;
    outline: none;
  }
  .task-add-row input[type=number]:focus {
    border-color: var(--pink);
  }
  .task-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .task-chip {
    background: var(--yellow);
    padding: 6px 10px 6px 14px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.95rem;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.05);
  }
  .task-chip button.del {
    background: #fff;
    color: #d9455f;
    box-shadow: none;
    padding: 2px 8px;
    font-size: 0.85rem;
    line-height: 1;
  }
  .empty-hint {
    text-align: center;
    padding: 10px;
    opacity: 0.6;
    font-size: 0.95rem;
  }

  /* student grid */
  .student-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: 1fr;
    gap: 8px;
    flex: 1;
    min-height: 0;
    width: 100%;
  }
  @media (max-width: 700px) {
    .student-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .student-card {
    position: relative;
    background: #ffffffee;
    border-radius: 16px;
    padding: 8px;
    border: 2px solid #ffe1ec;
    box-shadow: 0 4px 0 rgba(255, 180, 200, 0.3);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .student-card.all-done::before {
    content: '❤️';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 4rem;
    opacity: 0.16;
    pointer-events: none;
    z-index: 0;
  }
  .student-card > * {
    position: relative;
    z-index: 1;
  }
  .student-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  .student-header .num {
    background: var(--sky);
    border-radius: 50%;
    width: 26px;
    height: 26px;
    min-width: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Jua', sans-serif;
    font-size: 0.85rem;
  }
  .student-header .avatar {
    font-size: 1.1rem;
  }
  .name-input {
    flex: 1;
    min-width: 0;
    padding: 4px 8px;
    border-radius: 999px;
    border: 2px solid #ffd0e0;
    font-family: 'Gaegu', sans-serif;
    font-size: 0.9rem;
    outline: none;
    background: #fff8fb;
  }
  .name-input:focus {
    border-color: var(--pink);
  }

  .task-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .task-row {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    padding: 2px 4px;
    border-radius: 8px;
    transition: background 0.15s ease;
    flex-shrink: 0;
  }
  .task-row:hover {
    background: #fff2f6;
  }

  .chk-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 8px;
    background: #f1f1f1;
    border: 2px solid #e6e6e6;
    font-size: 1rem;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .task-row.checked .chk-label {
    background: linear-gradient(135deg, var(--mint), #7be3ab);
    border-color: #5fd393;
    animation: pop 0.25s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.7); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .task-row .task-text {
    font-size: 0.95rem;
    word-break: break-word;
  }
  .task-row.checked .task-text {
    text-decoration: line-through;
    opacity: 0.55;
  }

  footer {
    text-align: center;
    font-size: 0.7rem;
    opacity: 0.55;
    margin: 2px 0 0;
    flex-shrink: 0;
  }

  #confettiLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }
  .confetti-piece {
    position: absolute;
    top: -10%;
    font-size: 1.6rem;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0.9;
    }
  }

  #allDoneBanner {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(-140%);
    background: linear-gradient(90deg, #ffe1ec, #ffd0e2);
    border: 3px solid #fff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    border-radius: 999px;
    padding: 12px 28px;
    font-family: 'Jua', sans-serif;
    font-size: 1.1rem;
    color: #d9455f;
    z-index: 60;
    transition: transform 0.4s cubic-bezier(.5,1.8,.5,1);
  }
  #allDoneBanner.show {
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div id="confettiLayer"></div>
<div id="allDoneBanner">🎉 오늘 할 일을 모두 끝냈어요! 최고예요! 👏✨</div>

<div class="wrap">
  <h1>🎒 오늘 할 일 체크하기 ✨</h1>
  <p class="subtitle">오늘 내가 해야할 일을 스스로 체크해 보세요. 🌈</p>

  <div class="card">
    <div class="task-add-row">
      <label for="studentCountInput">👥 학생 수</label>
      <input type="number" id="studentCountInput" min="1" max="40" value="15">
      <span>명</span>
      <div class="sep"></div>
      <input type="text" id="taskInput" placeholder="할 일 입력" maxlength="30">
      <button id="addTaskBtn">➕ 할 일 추가</button>
    </div>
    <div class="task-chips" id="taskChips"></div>
    <div class="empty-hint" id="emptyHint" style="display:none;">아직 할 일이 없어요! 위에서 추가해보세요 🙌</div>
  </div>

  <div class="card grid-card">
    <div class="student-grid" id="studentGrid"></div>
  </div>

  <footer>💾 데이터는 이 컴퓨터의 브라우저에 자동으로 저장돼요 (인터넷 연결 필요 없음)</footer>
</div>

<script>
(function () {
  const STORAGE_KEY = 'vacationChecklistData_v1';
  const AVATARS = ['🐱','🐶','🐰','🐻','🦊','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🦄'];
  const MIN_STUDENTS = 1;
  const MAX_STUDENTS = 40;

  function getStudentIds() {
    return Array.from({ length: data.studentCount }, (_, i) => i + 1);
  }

  function todayStr() {
    const d = new Date();
    return fmt(d);
  }
  function fmt(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {
      tasks: [],
      names: {},
      records: {},
      studentCount: 15
    };
  }

  let data = loadData();
  if (!data.names) data.names = {};
  if (!data.studentCount) data.studentCount = 15;
  let currentDate = todayStr();

  function setStudentCount(n) {
    n = Math.floor(n);
    if (isNaN(n)) n = 15;
    n = Math.max(MIN_STUDENTS, Math.min(MAX_STUDENTS, n));
    data.studentCount = n;
    save();
    renderAll();
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function getDayRecord(dateStr) {
    if (!data.records[dateStr]) data.records[dateStr] = {};
    return data.records[dateStr];
  }

  function isStudentAllDone(dateStr, studentNum) {
    const total = data.tasks.length;
    if (total === 0) return false;
    const day = data.records[dateStr];
    const s = day ? day[studentNum] : null;
    const count = s ? Object.keys(s).length : 0;
    return count >= total;
  }

  function getChecked(dateStr, studentNum, taskId) {
    const day = data.records[dateStr];
    if (!day) return false;
    const s = day[studentNum];
    if (!s) return false;
    return !!s[taskId];
  }

  function setChecked(dateStr, studentNum, taskId, value) {
    const day = getDayRecord(dateStr);
    if (!day[studentNum]) day[studentNum] = {};
    if (value) day[studentNum][taskId] = true;
    else delete day[studentNum][taskId];
    save();
  }

  function setName(studentNum, value) {
    data.names[studentNum] = value;
    save();
  }

  function addTask(text) {
    const clean = text.trim();
    if (!clean) return;
    data.tasks.push({ id: 't_' + Date.now() + '_' + Math.floor(Math.random() * 1000), text: clean });
    save();
    renderAll();
  }

  function removeTask(id) {
    data.tasks = data.tasks.filter(t => t.id !== id);
    save();
    renderAll();
  }

  function renderTaskChips() {
    const wrap = document.getElementById('taskChips');
    const emptyHint = document.getElementById('emptyHint');
    wrap.innerHTML = '';
    if (data.tasks.length === 0) {
      emptyHint.style.display = 'block';
    } else {
      emptyHint.style.display = 'none';
    }
    data.tasks.forEach(task => {
      const chip = document.createElement('div');
      chip.className = 'task-chip';
      chip.innerHTML = `<span>${escapeHtml(task.text)}</span>`;
      const delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.textContent = '🗑️';
      delBtn.title = '이 할 일 삭제';
      delBtn.addEventListener('click', () => removeTask(task.id));
      chip.appendChild(delBtn);
      wrap.appendChild(chip);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderStudentGrid() {
    const grid = document.getElementById('studentGrid');
    grid.innerHTML = '';

    getStudentIds().forEach(i => {
      const card = document.createElement('div');
      card.className = 'student-card' + (isStudentAllDone(currentDate, i) ? ' all-done' : '');

      const header = document.createElement('div');
      header.className = 'student-header';
      const avatar = AVATARS[(i - 1) % AVATARS.length];
      header.innerHTML = `<span class="num">${i}</span><span class="avatar">${avatar}</span>`;

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.className = 'name-input';
      nameInput.placeholder = '이름';
      nameInput.maxLength = 10;
      nameInput.value = data.names[i] || '';
      nameInput.addEventListener('input', () => setName(i, nameInput.value));
      header.appendChild(nameInput);

      card.appendChild(header);

      const taskList = document.createElement('div');
      taskList.className = 'task-list';

      if (data.tasks.length === 0) {
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.style.padding = '4px';
        hint.textContent = '할 일이 없어요';
        taskList.appendChild(hint);
      }

      data.tasks.forEach(task => {
        const isChecked = getChecked(currentDate, i, task.id);
        const row = document.createElement('div');
        row.className = 'task-row' + (isChecked ? ' checked' : '');

        const label = document.createElement('span');
        label.className = 'chk-label';
        label.textContent = isChecked ? '✅' : '';

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;

        row.appendChild(label);
        row.appendChild(text);

        row.addEventListener('click', () => {
          const nowChecked = !getChecked(currentDate, i, task.id);
          setChecked(currentDate, i, task.id, nowChecked);
          if (nowChecked) burstConfettiNear(label);
          renderStudentGrid();
        });

        taskList.appendChild(row);
      });

      card.appendChild(taskList);
      grid.appendChild(card);
    });

    checkAllDone();
  }

  function checkAllDone() {
    const total = data.tasks.length;
    const banner = document.getElementById('allDoneBanner');
    if (total === 0) {
      banner.classList.remove('show');
      return;
    }
    let allDone = true;
    for (const i of getStudentIds()) {
      const day = data.records[currentDate];
      const s = day ? day[i] : null;
      const count = s ? Object.keys(s).length : 0;
      if (count < total) { allDone = false; break; }
    }
    if (allDone) {
      banner.classList.add('show');
      setTimeout(() => banner.classList.remove('show'), 3200);
    } else {
      banner.classList.remove('show');
    }
  }

  function burstConfettiNear(el) {
    const rect = el.getBoundingClientRect();
    const layer = document.getElementById('confettiLayer');
    const emojis = ['🎉','✨','⭐','🌟','🎈','💖','🍀'];
    for (let i = 0; i < 10; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const startX = rect.left + rect.width / 2 + (Math.random() * 60 - 30);
      piece.style.left = startX + 'px';
      piece.style.top = (rect.top) + 'px';
      const duration = 1 + Math.random() * 0.8;
      piece.style.animationDuration = duration + 's';
      layer.appendChild(piece);
      setTimeout(() => piece.remove(), duration * 1000 + 100);
    }
  }

  function renderAll() {
    document.getElementById('studentCountInput').value = data.studentCount;
    renderTaskChips();
    renderStudentGrid();
  }

  document.getElementById('addTaskBtn').addEventListener('click', () => {
    const input = document.getElementById('taskInput');
    addTask(input.value);
    input.value = '';
    input.focus();
  });
  document.getElementById('taskInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      document.getElementById('addTaskBtn').click();
    }
  });
  document.getElementById('studentCountInput').addEventListener('change', (e) => {
    setStudentCount(parseInt(e.target.value, 10));
  });
  renderAll();
})();
</script>
</body>
</html>
